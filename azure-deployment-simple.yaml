# Simple Azure Container Apps Deployment
# Free tier - minimal configuration

apiVersion: apps.azure.com/v1beta1
kind: ContainerApp
metadata:
  name: axxa-insurance
  resourceGroup: axxa-insurance-rg
properties:
  template:
    containers:
      - image: python:3.12-slim
        name: axxa-insurance
        command:
          - bash
          - -c
          - |
            apt-get update && apt-get install -y build-essential && rm -rf /var/lib/apt/lists/*
            pip install --no-cache-dir -r requirements.txt
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput
            gunicorn --bind 0.0.0.0:8000 axxa_insurance.wsgi:application
        resources:
          cpu: 0.25
          memory: 0.5Gi
        env:
          - name: DJANGO_SETTINGS_MODULE
            value: axxa_insurance.settings
          - name: PYTHONUNBUFFERED
            value: "1"
    scale:
      minReplicas: 1
      maxReplicas: 2
  configuration:
    activeRevisionsMode: single
    ingress:
      external: true
      targetPort: 8000
      transport: http
