{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-lg">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="fas fa-robot fa-4x text-primary mb-3"></i>
                    <h2 class="card-title">CertifyAI-Pro</h2>
                    <p class="text-muted">Sign in with your Google account to access your certification dashboard</p>
                </div>

                <div class="text-center">
                    <a href="{{ url_for('google_login') }}" class="btn btn-light btn-lg w-100 shadow-sm">
                        <i class="fab fa-google me-2"></i> Continue with Google
                    </a>
                </div>

                <div class="text-center mt-4">
                    <p class="small text-muted">
                        By signing in, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
